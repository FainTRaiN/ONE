<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아이콘 감지 TTS 알림</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div>
          <h1>아이콘 감지 TTS 알림</h1>
          <p>화면 공유로 실시간 감지 후 붉은색 동심원 아이콘을 발견하면 음성으로 알려드립니다.</p>
        </div>
        <div class="app__status" id="status">대기 중</div>
      </header>

      <section class="panel">
        <div class="panel__controls">
          <button id="startCapture">화면 공유 시작</button>
          <button id="stopCapture" disabled>중지</button>
          <label class="toggle">
            <input type="checkbox" id="autoSpeak" checked />
            <span>자동 음성 알림</span>
          </label>
        </div>

        <div class="panel__controls">
          <label class="field">
            알림 문구
            <input id="ttsText" type="text" value="붉은색 아이콘이 감지되었습니다." />
          </label>
          <label class="field">
            감지 민감도
            <input id="threshold" type="range" min="0" max="1" step="0.01" value="0.22" />
            <span id="thresholdValue">0.22</span>
          </label>
          <div class="field">
            <span>현재 점수</span>
            <strong id="scoreValue">-</strong>
          </div>
          <label class="field">
            샘플 이미지 불러오기
            <input id="templateUpload" type="file" accept="image/*" />
          </label>
        </div>
      </section>

      <section class="panel grid">
        <div>
          <h2>화면 미리보기</h2>
          <video id="screenPreview" autoplay playsinline muted></video>
          <canvas id="captureCanvas"></canvas>
        </div>
        <div>
          <h2>템플릿 미리보기</h2>
          <canvas id="templateCanvas" width="32" height="32"></canvas>
          <p class="hint">
            기본 템플릿은 붉은색 동심원 아이콘을 단순화한 형태입니다. 필요하면 사용자
            이미지로 교체해 주세요.
          </p>
          <div class="panel__controls">
            <button id="testSpeak">알림 테스트</button>
          </div>
          <div class="log" id="log"></div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
